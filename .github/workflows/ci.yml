name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --project backend
      - name: Lint
        run: uv run --project backend ruff check .
      - name: Typecheck
        run: uv run --project backend mypy app
      - name: Tests
        run: uv run --project backend pytest -q

  worker:
    name: Worker (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --project worker
      - name: Lint
        run: uv run --project worker ruff check .
      - name: Typecheck
        run: uv run --project worker mypy worker
      - name: Tests
        run: uv run --project worker pytest -q

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Build (termasuk typecheck)
        run: npm run build --prefix frontend

  infra:
    name: Compose config valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
