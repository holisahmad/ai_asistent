name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_assistant
          POSTGRES_PASSWORD: ai_assistant
          POSTGRES_DB: ai_assistant_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ai_assistant -d ai_assistant_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --user root
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy app
      - name: Migrate (test DB)
        run: uv run alembic upgrade head
        env:
          APP_DATABASE_URL: postgresql+psycopg://ai_assistant:ai_assistant@localhost:5433/ai_assistant_test
      - name: Tests
        run: uv run pytest -q
        env:
          APP_DATABASE_URL: postgresql+psycopg://ai_assistant:ai_assistant@localhost:5433/ai_assistant_test

  worker:
    name: Worker (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (termasuk typecheck)
        run: npm run build

  security:
    name: Security (secret & dependency scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (blocking)
        run: ./scripts/scan_secrets.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Dependency audit Python (non-blocking)
        run: uvx pip-audit --progress-spinner off
        continue-on-error: true

  infra:
    name: Compose config valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
