[project]
name = "ai-asistent-core"
version = "0.1.0"
description = "Shared domain: config, models, storage, parsers, chunking, embeddings, vector store"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "redis>=5.2",
    "minio>=7.2",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_asistent_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
