# Nginx reverse proxy — AI Knowledge Assistant (Fase 9)
# - HTTP → HTTPS redirect
# - TLS termination (uncomment ssl_* setelah Certbot jalan)
# - Security headers (HSTS, CSP, X-Frame-Options, ...)
# - Rate limiting (per-IP burst)
# - Upstream keepalive ke FastAPI

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Log format JSON (mudah di-parse Loki/ELK) ----
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;                 # sembunyikan versi nginx
    client_max_body_size 110M;           # sedikit di atas APP_MAX_UPLOAD_BYTES (100 MB)

    # ---- Gzip ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-www-form-urlencoded;
    gzip_min_length 1024;
    gzip_proxied any;

    # ---- Rate limit ----
    # Zone 10 MB → ~160.000 IP unik; burst 20, tanpa delay sampai 10 req/s
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=2r/s;

    # ---- Upstream FastAPI ----
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # ---- HTTP: redirect semua ke HTTPS ----
    server {
        listen 80;
        server_name _;

        # Certbot webroot challenge (biarkan via HTTP)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check internal (load balancer bisa hit via HTTP)
        location = /health/live {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # Semua lain → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl http2;
        server_name _;           # ganti dengan domain nyata

        # --- TLS (uncomment + isi path setelah Certbot) ---
        # ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
        # ssl_trusted_certificate /etc/letsencrypt/live/DOMAIN/chain.pem;

        # Fallback self-signed untuk test (hapus saat pakai Certbot)
        ssl_certificate     /etc/nginx/ssl/self.crt;
        ssl_certificate_key /etc/nginx/ssl/self.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                    ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ---- Security headers ----
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;

        # ---- Correlation ID ----
        set $request_id_val $http_x_request_id;
        if ($request_id_val = "") {
            set $request_id_val $request_id;
        }

        # ---- Health endpoints (tanpa rate limit) ----
        location ~ ^/health/(live|ready)$ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_val;
            proxy_read_timeout 10s;
        }

        # ---- Metrics (internal only — blokir dari internet) ----
        location = /metrics {
            # Izinkan hanya dari jaringan internal / monitoring
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # ---- Upload API (rate limit lebih ketat) ----
        location ~ ^/api/v1/workspaces/[^/]+/files$ {
            limit_req zone=upload_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_val;
            proxy_read_timeout 120s;     # upload besar butuh waktu
            proxy_request_buffering off; # streaming upload
        }

        # ---- SSE chat stream ----
        location ~ ^/api/v1/workspaces/[^/]+/chat/stream$ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_val;
            proxy_read_timeout 300s;     # SSE stream bisa lama
            proxy_buffering off;         # wajib untuk SSE
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
        }

        # ---- API umum ----
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_val;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # ---- Frontend static (Next.js di container terpisah) ----
        # Uncomment bila frontend di-serve via container next-server:3000
        # location / {
        #     proxy_pass http://frontend:3000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }

        # ---- 404 fallback ----
        location / {
            return 404 '{"detail":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
