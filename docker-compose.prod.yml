# Infrastruktur produksi — AI Knowledge Assistant
# Fase 9: worker service, nginx reverse proxy, health-based restart, volume backup.
#
# Pemakaian:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#
# Variabel wajib diset via .env.prod (JANGAN commit file ini):
#   APP_OPENAI_API_KEY, APP_MINIO_SECRET_KEY, APP_METRICS_TOKEN
#   POSTGRES_PASSWORD, DOMAIN (untuk Certbot/Nginx)
#
# Untuk HTTPS dengan Certbot:
#   docker run --rm -v $(pwd)/infra/certbot:/etc/letsencrypt certbot/certbot \
#     certonly --webroot -w /var/www/certbot -d $DOMAIN
# Kemudian uncomment baris ssl_* di infra/nginx/nginx.conf.

services:
  # ----------------------------------------------------------------
  # Nginx reverse proxy (HTTP → HTTPS redirect + TLS termination)
  # ----------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: aiassistant-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certbot/live:/etc/letsencrypt/live:ro
      - ./infra/certbot/archive:/etc/letsencrypt/archive:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ----------------------------------------------------------------
  # Backend API
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: aiassistant-api
    env_file:
      - .env.prod
    environment:
      APP_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-ai_assistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_assistant}"
      APP_REDIS_URL: "redis://redis:6379/0"
      APP_MINIO_ENDPOINT: "minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    # Tidak expose port langsung — nginx yang proxy
    expose:
      - "8000"

  # ----------------------------------------------------------------
  # RQ Worker (background ingestion + indexing)
  # ----------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: aiassistant-worker
    env_file:
      - .env.prod
    environment:
      APP_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-ai_assistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_assistant}"
      APP_REDIS_URL: "redis://redis:6379/0"
      APP_MINIO_ENDPOINT: "minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import redis, os; r=redis.from_url(os.environ['APP_REDIS_URL']); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------
  # Certbot (renew otomatis; jalankan manual atau via cron)
  # ----------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: aiassistant-certbot
    volumes:
      - ./infra/certbot/live:/etc/letsencrypt/live
      - ./infra/certbot/archive:/etc/letsencrypt/archive
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # ----------------------------------------------------------------
  # PostgreSQL (override: internal-only, no port mapping)
  # ----------------------------------------------------------------
  postgres:
    ports: []
    expose:
      - "5432"

  # ----------------------------------------------------------------
  # Redis (override: internal-only)
  # ----------------------------------------------------------------
  redis:
    ports: []
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]

  # ----------------------------------------------------------------
  # MinIO (override: internal-only, no console in prod)
  # ----------------------------------------------------------------
  minio:
    ports: []
    expose:
      - "9000"

volumes:
  certbot_webroot:
