[project]
name = "ai-assistant-backend"
version = "0.2.0"
description = "AI Knowledge Assistant — Backend API (FastAPI) pada uv workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "pgvector>=0.3",
    "rq>=2.1",
    "ai-asistent-core",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-env>=1.1",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
ai-asistent-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["minio.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pytest_env]
APP_DATABASE_URL = "postgresql+psycopg://ai_assistant:ai_assistant@localhost:5433/ai_assistant_test"
APP_REDIS_URL = "redis://localhost:6380/0"
